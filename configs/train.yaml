# Install requirements.txt using a CUDA-compatible PyTorch environment first.
# Single-GPU starting point, not a measured VRAM guarantee. Sequence limits
# are fail-fast guards, not data filters: long examples raise, never truncate.
model:
  pretrained_name_or_path: Qwen/Qwen3-0.6B
  attention_backend: sdpa
  num_codebooks: 32
  codebook_size: 2048
  freeze_backbone: false
  gradient_checkpointing: true

data:
  train_dir: /home/gt/guhj/data/tts_32q/train
  validation_dir: /home/gt/guhj/data/tts_32q/validation
  test_dir: /home/gt/guhj/data/tts_32q/test
  cache_size: 1
  reference_prob: 0.8
  num_workers: 2

training:
  output_dir: outputs/tts
  tensorboard: true # events in <output_dir>/tensorboard; false disables logging
  device: cuda # cpu uses float32, regardless of precision, for smoke tests
  precision: fp16 # fp32 | fp16 | bf16; weights always remain float32
  seed: 42
  batch_size: 1
  gradient_accumulation_steps: 16
  epochs: 10 # complete passes over the training split
  learning_rate: 0.0001
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 0.00000001
  warmup_steps: 500
  max_grad_norm: 1.0
  log_every: 10
  save_every: 500

masking:
  mask_min: 0.05
  mask_max: 1.0
  max_text_tokens: 512 # reject, never truncate
  max_sequence_length: 40960

evaluation:
  every_steps: 500 # validation only; also run at each epoch end
  batch_size: 1
  max_batches: 50
  seed: 1234 # reset references + masks and restore training RNG afterward

# Checkpoints: last.pt, best.pt; offline companions: backbone_config.json,
# tokenizer/. Resume with unchanged data/model/masking and loader settings:
# bash scripts/train.sh configs/train.yaml --resume outputs/tts/last.pt
# Resume replays skipped batches; exact replay assumes unchanged data, worker
# count, batching, software/device and stochastic settings. CUDA kernels are not
# forced deterministic. Existing nonempty output directories require --resume.
# Explicit test only: append --resume outputs/tts/best.pt --test-only.
